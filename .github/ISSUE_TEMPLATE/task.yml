name: 작업 이슈
description: 실험, 데이터, 문서 또는 오류와 관련된 작업을 제안하고 추적합니다.
title: "[Issue] "
body:
  - type: markdown
    attributes:
      value: |
        이슈를 작성하기 전에 `CONTRIBUTING.md`와 관련 example을 확인해 주세요.

  - type: dropdown
    id: work_type
    attributes:
      label: 작업 유형
      description: 이 이슈와 가장 가까운 유형을 선택해 주세요.
      options:
        - 실험
        - 데이터
        - 문서
        - 버그
        - 기타
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: 작업 요약
      description: 수행하려는 작업을 한 문장으로 작성해 주세요.
      placeholder: 예) 기본 분류 모델의 기준 성능 측정
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: 목적과 배경
      description: 이 작업이 필요한 이유와 확인하려는 내용을 작성해 주세요.
      placeholder: 작업의 배경, 해결하려는 문제, 필요한 이유를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 할 일
      description: 완료할 작업을 체크리스트로 작성해 주세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: 완료 조건 또는 예상 결과
      description: 어떤 상태가 되면 이 작업을 완료한 것으로 볼 수 있는지 작성해 주세요.
      placeholder: 예) 노트북 전체 실행 완료 및 Accuracy와 F1 기록
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 확인 사항
      options:
        - label: CONTRIBUTING.md와 관련 example을 확인했습니다.
          required: true
        - label: 실제 원본 데이터나 모델 파일을 이슈에 첨부하지 않았습니다.
          required: true
